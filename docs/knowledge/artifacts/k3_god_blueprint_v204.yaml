# SECTION 6: HOW-TO FOR ZCODE  (implementation order; verify after EVERY step)
# ════════════════════════════════════════════════════════════════════════════
section_6_howto_for_zcode:

  files_to_modify:
    - "Install-BOM-AI-Online.bat (master Windows installer; the PS payload after marker :::BOMAI_PS_PAYLOAD_20261030)"
    - "seed_owui.py (shared source — FIX-05; lives in repo AND embedded 2×: $PIN.seedPayload in the BAT, and inside the unix zip payload)"
    - "install_unix.py (shared macOS+Linux payload — FIX-01/02/03/04/06/08/09 + new --uninstall)"
    - "build_installers.py (regenerates install-bom-ai-linux.sh + install-bom-ai-mac.command from payload; the sh/command files are GENERATED — never hand-edit)"
    - "NOT bom_runtime.py, NOT bomai_han_policy.py / bomai_owui_boundary.py / bomai_owui_han_guard.py / install_hf1.py (FORBIDDEN)"

  step_by_step:
    - step: 1
      action: "BAT: add Stop-BomaiOwnedProcesses + Test-OwnedPid + Get-OllamaModelsRoot INSIDE both $EngineDef and $UninstallDef (copy the Section 3 code verbatim; runspace isolation means 2 copies — add a build comment 'KEEP IN SYNC')"
      verify: "extract payload and parse: powershell -NoProfile -Command \"$t=[IO.File]::ReadAllText('Install-BOM-AI-Online.bat'); $p=$t.Substring($t.IndexOf(':::BOMAI_PS_PAYLOAD_20261030')); $e=$null; [void][System.Management.Automation.PSParser]::Tokenize($p,[ref]$e); 'TOKENS_OK'\""
    - step: 2
      action: "BAT: FIX-01 call sites (uninstall step 0; fresh-dir stop block 731-744), mutex unification (775, 668, 1622 → 'Local\\BOM-AI-Installer')"
      verify: "grep -n 'BOM-AI-Installer' Install-BOM-AI-Online.bat → exactly 3 hits, all identical string"
    - step: 3
      action: "BAT: FIX-04 (tier preselect + console tier default), FIX-07 (S0 disk tolerance), FIX-08 (pointer adoption + BtnInstall guard), FIX-10 (version display), FIX-06 (series accept + acceptedVer → runtime.json expected_version + install.json), FIX-09 (shortcut_paths record at S11 + uninstall consumer), FIX-02 (ChkUnOllama XAML + RES strings + worker var + removal block), FIX-03 (resolver in GUI size label)"
      verify: "same PSParser tokenize; then validatepath smoke: set BOMAI_VALIDATE_PATH=D:\\ & Install-BOM-AI-Online.bat validatepath → JSON ok=true (on a drive with space)"
    - step: 4
      action: "seed_owui.py: apply FIX-05 patch; bump SEED_REVISION='bomai-v2.0.4-hf1-1'; add --force-reseed"
      verify: "python seed_owui.py --help shows --force-reseed; python -m py_compile seed_owui.py"
    - step: 5
      action: "re-embed seed into BAT: $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes('seed_owui.py')); replace the single-quoted $PIN.seedPayload value; CONFIRM the byte length changes and quotes intact"
      verify: "powershell: decode the new payload back and diff against seed_owui.py → identical; ALSO confirm $PIN has no other seedPayload key"
    - step: 6
      action: "install_unix.py: new stop() + port_owner_pids + pid_cmdline + ollama_models_root; --uninstall/--remove-data/--remove-models/--remove-ollama/--accept-ollama-version args; resolve_root pointer logic; created_paths in create_launcher; flock installer.lock; tier-source log; expected_version=observed"
      verify: "python -m py_compile install_unix.py && python install_unix.py --help | grep -E 'uninstall|remove-ollama|accept-ollama-version'"
    - step: 7
      action: "run build_installers.py → regenerates install-bom-ai-linux.sh + install-bom-ai-mac.command; confirm zip payload contains the NEW install_unix.py + seed_owui.py"
      verify: "bash -n install-bom-ai-linux.sh; unzip -p install-bom-ai-mac.command 2>/dev/null || python -c \"import re,base64,zipfile,io; t=open('install-bom-ai-mac.command').read(); z=zipfile.ZipFile(io.BytesIO(base64.b64decode(re.search(r'b64decode\\\\(\\\"([^\\\"]+)\\\"\\\\)',t).group(1)))); print(z.namelist())\""
    - step: 8
      action: "bump $PIN.release='2.0.4' / $script:BOMAI_VERSION='v2.0.4' / VERSION='2.0.4' (unix) / GUI HdrVersion Text / RES meta strings; add install.json schema=2 + version fields"
      verify: "grep -n \"2.0.4\" Install-BOM-AI-Online.bat install_unix.py | head"
    - step: 9
      action: "QC street test — run Section 7 matrix: Windows ≥12 tests, macOS ≥6, Linux ≥6; every row PASS or it does not ship"
      verify: "matrix log + live-chat Han=0 evidence attached to the release ticket"
    - step: 10
      action: "ship (Section 8)"

  base64_reencode_rules: |
    - seedPayload is the ONLY payload this blueprint changes. gatewayPayload / policyPayload /
      boundaryPayload / guardPayload / hf1Payload / auditPayload / catalogPayload stay byte-identical
      (FORBIDDEN files untouched).
    - Encode with [Convert]::ToBase64String([IO.File]::ReadAllBytes(path)) — UTF-8 bytes, no BOM juggling.
    - Unix payload: never hand-edit the .sh/.command; regenerate via build_installers.py.
    - After either re-embed, sha256 the source file and assert the decoded payload hash matches.

  testing_procedure: "Section 7 matrix, in order, on real machines (win10/11 x64, macOS 13+ arm64+x86_64, Ubuntu 22.04+). QC isolation on Windows uses BOMAI_QC=1 + BOMAI_ROOT_OVERRIDE (ports 18080/18888/11436) so a production install on the same box is never disturbed."

