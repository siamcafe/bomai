# ── bomai.app (bomai_website_build 2026-10-05) ──────────────────────────────
# Grav 2.2.4 site, theme user/themes/bomai. Previous flood-clone config is
# preserved at bomai-app.conf.floodbak_<ts>. flood.siamcar.app untouched.
# Cert: acme.sh LE (bomai.app + www.bomai.app, ec-256), renewed via the DA
# webroot path included from webapps.conf — keep that include in every block.
server {
    listen 122.155.168.7:80;
    server_name bomai.app www.bomai.app;
    access_log /var/log/nginx/domains/bomai.app.log;
    error_log /var/log/nginx/domains/bomai.app.error.log;
    include /etc/nginx/webapps.conf;
    location / { return 301 https://bomai.app$request_uri; }
}

server {
    listen 122.155.168.7:443 ssl;
    http2 on;
    server_name www.bomai.app;
    access_log /var/log/nginx/domains/bomai.app.log;
    error_log /var/log/nginx/domains/bomai.app.error.log;
    ssl_certificate /etc/nginx/ssl/bomai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bomai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bomai_ssl:10m;
    include /etc/nginx/webapps.conf;
    return 301 https://bomai.app$request_uri;
}

server {
    listen 122.155.168.7:443 ssl;
    http2 on;
    server_name bomai.app;
    access_log /var/log/nginx/domains/bomai.app.log;
    error_log /var/log/nginx/domains/bomai.app.error.log;

    root /home/siamcar/domains/bomai.app/public_html;
    index index.php index.html;

    ssl_certificate /etc/nginx/ssl/bomai/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bomai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bomai_ssl:10m;
    include /etc/nginx/webapps.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # /manual/ one-hop 302 to siamcafebook manual (skip Grav trailing-slash canonical) [bom-ai 2026-10-10]
    location = /manual/ { return 302 https://siamcafebook.com/bomai/manual/; }
    # web_NasLocal P3: Grav 2.2.22 security policy (same as other 6 Grav sites)
    include /etc/nginx/grav-policy/grav-security.conf;
    # Grav deny list (must precede other regex locations)
    location ~* ^/(user/accounts|user/config|user/data|cache|logs|backup|\.git|bin|vendor|system|tests)(/|$) {
        deny all;
        return 404;
    }
    # release.json updater manifest — exact-match wins over the .json deny below [web_repair_v1 2026-10-25]
    location = /release.json {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    # /dl/release.json updater manifest — exact-match wins over the .json deny below [mega_v2 2026-10-28]
    location = /dl/release.json {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    # /dl/stats.json aggregate download counters — exact-match wins over the .json deny below [final_close 2026-11-03]
    location = /dl/stats.json {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # [installer_release_v1 20261030] exact-match whitelist: dl installers must bypass
    # the Grav extension-deny regex (md -> 404) and the global modsec exe rule (bat/sh -> 406)
    location = /dl/Install-BOM-AI.bat {
        alias /home/siamcar/domains/bomai.app/dl/Install-BOM-AI.bat;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        modsecurity off;
    }
    location = /dl/install-bom-ai-mac.sh {
        alias /home/siamcar/domains/bomai.app/dl/install-bom-ai-mac.sh;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        modsecurity off;
    }
    location = /dl/install-bom-ai-linux.sh {
        alias /home/siamcar/domains/bomai.app/dl/install-bom-ai-linux.sh;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        modsecurity off;
    }
    location = /dl/bomai-windows-installer-r2.zip {
        alias /home/siamcar/domains/bomai.app/dl/bomai-windows-installer-r2.zip;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        modsecurity off;
    }

    # [mega_online_v1 20261031] online installer + /dl/online/ runtime payload channel
    location = /dl/Install-BOM-AI-Online.bat {
        alias /home/siamcar/domains/bomai.app/dl/Install-BOM-AI-Online.bat;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges bytes;
        modsecurity off;
    }
    location = /dl/online/models.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /dl/support-matrix.md {
        alias /home/siamcar/domains/bomai.app/dl/support-matrix.md;
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /dl/update-policy.md {
        alias /home/siamcar/domains/bomai.app/dl/update-policy.md;
        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(md|twig|yaml|yml|lock|dist|json)$ {
        deny all;
        return 404;
    }

    # installer binaries live OUTSIDE the Grav tree; ranges on by default
    # legacy installer retired 2026-10-22 (moved to /home/siamcar/bomai-retired-downloads)
    location = /dl/BOM-AI-Installer.exe { return 410; }
    location /dl/ {
        alias /home/siamcar/domains/bomai.app/dl/;
        autoindex off;
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
    }

    # long-cache static assets
    location ~* \.(css|js|mjs|woff2?|avif|webp|png|jpe?g|svg|ico|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 301 redirect how-to-use -> siamcafebook manual [bomai Deploy_HowTo_Redirect_301 2026-11-05]
    location ~* ^/([\w-]+/)?how-to-use(/.*)?$ {
        return 301 https://siamcafebook.com/bomai/manual/;
    }
    location ~* ^/([\w-]+/)?howto(/.*)?$ {
        return 301 https://siamcafebook.com/bomai/manual/;
    }

    # Grav front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/usr/local/php83/sockets/siamcar.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
        fastcgi_hide_header Link;
    }
}
