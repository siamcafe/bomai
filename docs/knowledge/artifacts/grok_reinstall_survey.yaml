## PART 1: READ THE BAT SOURCE — grep every path, every action

1.1 Get the BAT file:
    curl -sL "https://github.com/siamcafe/bomai/releases/download/v2.0.3/Install-BOM-AI-Online.bat" -o /tmp/bomai_bat.txt
    OR: SSH i9, find the BAT: Get-ChildItem -Path E:\BOMAI -Recurse -Filter "*.bat" | Select-Object FullName,Length

1.2 Read the ENTIRE BAT and document:
    a) Every directory it creates (mkdir, md)
    b) Every file it downloads (curl, Invoke-WebRequest, bitsadmin)
    c) Every file it writes/copies/moves
    d) Every registry key it touches (if any)
    e) Every environment variable it sets (setx, set)
    f) Every scheduled task or service it creates
    g) Every shortcut it creates (desktop, start menu)
    h) Every process it starts (ollama serve, python, etc.)
    i) Every port it opens/binds
    j) The install directory — where is the root? (AppData? D:\BOMAI? user-chosen?)

1.3 Map the FULL file tree after install:
    Based on the BAT logic, list every file and folder that would exist after a clean install.
    Mark each as: CONFIG (user data), MODEL (large, downloaded), BINARY (program files), TEMP (can delete)

## PART 2: REINSTALL SCENARIO ANALYSIS

Read the BAT code and answer these questions with evidence (line numbers or code snippets):

2.1 What happens if the user runs the BAT when BOM AI is already installed?
    - Does it check for existing install? (grep for "if exist", "test -d", directory checks)
    - Does it skip download if files already exist?
    - Does it overwrite config files? (god.env, config_g, models.json)
    - Does it overwrite the model? (ollama create vs ollama pull — does it re-pull?)
    - Does it kill existing processes first? (taskkill, Stop-Process)
    - Does it backup anything before overwriting?

2.2 Specific collision scenarios:
    a) Ollama already running on :11434 → BAT tries to start another instance → port conflict?
    b) Open WebUI venv already exists → BAT creates new venv or reuses?
    c) bomai-safe model already exists → ollama create overwrites or skips?
    d) User has chat history in Open WebUI → preserved or lost?
    e) User changed settings in Open WebUI → preserved or lost?
    f) User downloaded additional models → preserved or removed?
    g) bom_runtime.py already running → conflict?

2.3 Rate each scenario: SAFE (no problem) / BROKEN (data loss or error) / UNKNOWN (need testing)

## PART 3: UNINSTALL SCENARIO ANALYSIS

3.1 List EVERYTHING that must be removed for a clean uninstall:
    a) Install directory and all contents (path from Part 1)
    b) Ollama — where is it installed? Models directory? Config?
       - Default: C:\Users\<user>\AppData\Local\Programs\Ollama\
       - Models: C:\Users\<user>\.ollama\models\ (or OLLAMA_MODELS env var)
       - Config: C:\Users\<user>\.ollama\
    c) Open WebUI — venv directory, data directory, webui.db
    d) Python — did the BAT install Python or use existing?
    e) Environment variables set by the BAT (OLLAMA_HOST, OLLAMA_MODELS, etc.)
    f) Scheduled tasks (if any)
    g) Desktop shortcuts (if any)
    h) Start menu entries (if any)
    i) Registry keys (if any)
    j) Firewall rules (if any)
    k) Temp files in %TEMP%
    l) Log files

3.2 For each item, note:
    - Exact path or registry key
    - Size (approximate: small config vs multi-GB models)
    - Risk if left behind (harmless vs takes disk space vs security risk)
    - Can the user find it easily? (obvious path vs hidden AppData)

3.3 Estimate total disk footprint:
    - Ollama binary: ~X MB
    - Models (Light tier Qwen 4.2B Q4_K_M): ~X GB
    - Open WebUI + venv: ~X MB
    - bom_runtime.py + gateway: ~X MB
    - Total: ~X GB

## PART 4: USER JOURNEY QC (mental walkthrough, no execution)

4.1 Scenario A — Fresh install user, happy, wants to upgrade to v2.0.4 later:
    - What should they do? Run new BAT?
    - What will break?
    - What will they lose?

4.2 Scenario B — User installed, doesn't like it, wants to remove everything:
    - What do they need to delete?
    - Will they know what to delete?
    - Will they miss anything? (hidden folders, env vars)
    - How much disk space will they recover?

4.3 Scenario C — User installed on D:\, runs BAT again from different location:
    - Does the BAT remember the old install path?
    - Will it create a second copy?

4.4 Scenario D — User has Ollama already installed (for other models):
    - Does the BAT conflict with existing Ollama?
    - Does it change their OLLAMA_HOST/OLLAMA_MODELS?
    - Does it affect their other models?

4.5 For each scenario, rate:
    - User experience: GOOD / CONFUSING / BROKEN
    - Data safety: SAFE / RISK / LOSS
    - Recommendation: what SHOULD happen (for future fix)

