# SECTION 5: REINSTALL DESIGN
# ════════════════════════════════════════════════════════════════════════════
section_5_reinstall_design:

  same_version_rerun: |
    resumeKey identical + COMPLETE → S0 verify-only fast path (restart stopped services, verify alias,
    RC=0, 'reused_verified_existing'). FIX-07 removes the false E-DISK on this path. No data touched,
    no re-download, no re-seed. (unix: full re-run today — v2.0.4 keeps that behavior; it is idempotent:
    model pull skipped via tags check, venvs reused, seed is merge/preserve after FIX-05.)

  version_upgrade_203_to_204:
    trigger: "release 2.0.3 → 2.0.4 changes resumeKey → fresh release dir path (BAT 731+)."
    sequence: |
      1. Detection: GUI → installed page showing real version (FIX-10) → user picks Update/Repair →
         tier pre-selected from install.json (FIX-04).
      2. Stop-BomaiOwnedProcesses on the OLD root services (FIX-01 — this is the step that v2.0.3
         got wrong; old OWUI must release 8080 before S8).
      3. Engine runs S1..S12 into releases\2.0.4\b<ts>; downloads reuse cache\sha256 (hash-verified).
      4. S8a dataDir resolution: prevInstall.dataDir honored (existing logic, BAT ~1126-1130) →
         chats/settings/first-login carry over untouched.
      5. gateway_key carried over from existing runtime.json (existing logic) → OWUI seed re-wires
         same key; sessions survive (WEBUI secret in data/ untouched).
      6. Seed with FIX-05 policy (PRESERVE class), SEED_REVISION bump, force_reseed absent.
      7. S9: model already in store → ollama pull returns instantly (manifest present), alias re-created
         onto same blobs (no re-download); legacy alias preserved (existing 4A.2 logic).
      8. S11 shortcuts re-created → point at the NEW release; shortcut_paths updated in install.json.
      9. S12 commit flips active-release.txt; post-commit cleanup (NEW): delete release dirs of older
         releases keeping the current one + newest previous (rollback window):
             Get-ChildItem <root>\releases -Directory | Where-Object Name -ne $PIN.release →
             remove all but the single newest build dir of the previous release.
      10. Final state: one active 2.0.4 release, old build kept as rollback, zero user-data writes.

  preservation_rules:
    config_keys: "FIX-05 classification (FORCE/PRESERVE/MERGE) is the whole rule set — do not add ad-hoc overwrites."
    carried_forward: "data/, first-login.json, gateway_key, tier, install root, model store + extra models, user shortcuts choice (shortcut/startmenu/signin defaults re-read from install.json components record — NEW: persist OPT flags at S2 as install.json options{...}; pre-check boxes on repair)"
    never_carried: "pid files, logs, cache, old release binaries, CORS/QC origins"

  unix_reinstall_flow: |
    Plain re-run (any reason) now: resolves root (FIX-08 pointer) → stops owned services (new stop())
    → re-copies payload → install_ollama (reuse, FIX-06 policy) → model_setup (idempotent) → venvs
    (pip re-run, idempotent) → HF-1 (idempotent, fail-closed) → seed (FIX-05 policy) → verify →
    launcher re-written + created_paths refreshed. Data/, first-login.json, gateway_key
    (cfg.setdefault) preserved by construction.

